[package]
name = "mivlet-windows-executor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
getrandom = "0.3"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Isolation",
  "Win32_Security_Authorization", "Win32_System_Threading",
  "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_Pipes",
  "Win32_System_IO", "Win32_System_StationsAndDesktops",
  "Win32_UI_Shell", "Win32_System_Com", "Win32_Security_Credentials",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Registry",
  "Win32_Security_Cryptography",
] }
