<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fable computer</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151619;color:#ececee;font:14px system-ui}body{display:flex;flex-direction:column}header{height:56px;flex:none;padding:0 20px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #303136}header strong{font-weight:500}header span{color:#acaeb5;margin-right:auto}button{font:inherit;color:inherit;background:#282a30;border:1px solid #494b54;border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer}button:focus-visible,#screen:focus-visible{outline:2px solid #adbdf0;outline-offset:-3px}button:disabled{opacity:.5;cursor:default}#screen{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}canvas{outline:none}#status{position:absolute;inset:56px 0 28px;display:grid;place-items:center;color:#b6b7bb;pointer-events:none}footer{height:28px;color:#999ca6;font-size:12px;text-align:center;padding:5px}#reconnect{display:none}</style>
</head><body><header><strong>Computer</strong><span id="control-state" role="status">Connecting…</span><button id="reconnect">Reconnect</button><button id="take" disabled>Take control</button><button id="resume" hidden>Return control</button></header><div id="screen" tabindex="0" aria-label="Agent computer desktop"></div><div id="status" role="status">Connecting to the computer…</div><footer id="privacy">Watching the agent. Take control for a private step.</footer><script type="module" src="./app.js"></script></body></html>
