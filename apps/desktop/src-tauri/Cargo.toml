[package]
name = "praxis-desktop"
version = "0.1.0"
description = "Praxis desktop runtime"
authors = ["Praxis"]
edition = "2021"

[lib]
name = "praxis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "praxis-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
