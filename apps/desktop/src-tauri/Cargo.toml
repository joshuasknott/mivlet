[package]
name = "mivlet-desktop"
version = "0.1.0"
description = "Mivlet desktop runtime"
authors = ["Mivlet"]
edition = "2021"

[lib]
name = "mivlet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mivlet-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Compiles the shared TypeScript/Rust secret-redaction patterns from
# packages/protocol/src/secret-redaction.json (already in the lockfile).
regex = "1.12.4"
tauri = { version = "2", features = [] }
# Native OS notifications for completion, failure, and approval-needed states.
# Pinned to the Tauri 2 plugin line; bodies are shaped (privacy-safe) in TS.
tauri-plugin-notification = "2"
chrono = { version = "0.4.45", default-features = true }
chrono-tz = "0.10"
# Native-API egress: reqwest owns the HTTP/SSE call (Rust adds the API key as a
# header here; TS never sees it). `rustls-no-provider` resolves offline against
# the existing lockfile (verified during planning). `stream` enables SSE.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "multipart",
    "query",
    "rustls-no-provider",
    "stream",
] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net", "io-util", "process"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"
# Extract the main readable text and source metadata from fetched HTML. This is
# local parsing only; Mivlet still owns outbound policy, size limits and citations.
dom_smoothie = "0.18"
jsonwebtoken = { version = "9", default-features = false }
# OS-secure credential storage for agent-runtime API keys. The keyring crate
# speaks the platform-native store (Windows Credential Manager, macOS
# Keychain, Linux Secret Service) and ships a `mock` in-process backend used
# by tests so they never touch the real OS keychain. v3 is the current
# stable line with the bring-your-own-store architecture.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Encrypted local-first store (see docs/superpowers/specs/2026-06-28-encrypted-storage-design.md).
# `rusqlite` `bundled` compiles the SQLite C amalgamation with the system C
# compiler (no system SQLite needed). SQLCipher was ruled out: every flavor
# needs a system OpenSSL (`OPENSSL_DIR`) or a full Perl to build vendored
# OpenSSL, neither of which is reliably present in this build env or CI.
# Encryption is therefore application-layer AES-256-GCM (pure Rust, no native
# crypto) over bundled SQLite. The 32-byte master key lives in OS secure
# storage under a dedicated keyring service (`com.fable.workspace.vault`).
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
hex = "0.4"
tempfile = "3"
# Managed Google Antigravity runtime archives are ZIP files. Only DEFLATE
# decoding is enabled; Mivlet never creates archives or enables legacy codecs.
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Parser-backed validation for untrusted PDF artifacts. Defaults are disabled to
# avoid unrelated date, image and parallel-processing dependencies; strict load
# options and Mivlet-owned bounds are applied before a PDF can reach a host app.
lopdf = { version = "0.44.0", default-features = false }
png = "=0.17.16"
crc32fast = "=1.5.0"
# Relationship attributes must be decoded before deciding whether an OOXML
# document reaches a host Office application.
quick-xml = "0.42.0"
rfd = "=0.17.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility"] }
# The managed Antigravity binary launches a child ACP process. A Windows job
# keeps that full process tree tied to Mivlet so failed checks cannot leave a
# profile-locking ACP process behind.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
] }
