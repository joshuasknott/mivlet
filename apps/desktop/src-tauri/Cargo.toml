[package]
name = "fable-desktop"
version = "0.1.0"
description = "Fable desktop runtime"
authors = ["Fable"]
edition = "2021"

[lib]
name = "fable_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fable-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Native OS notifications for workflow completion/failure/approval-needed.
# Pinned to the Tauri 2 plugin line; bodies are shaped (privacy-safe) in TS.
tauri-plugin-notification = "2"
chrono = { version = "0.4.45", default-features = true }
# Native-API egress: reqwest owns the HTTP/SSE call (Rust adds the API key as a
# header here; TS never sees it). `rustls-no-provider` resolves offline against
# the existing lockfile (verified during planning). `stream` enables SSE.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "query",
    "rustls-no-provider",
    "stream",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net", "io-util", "process"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"
jsonwebtoken = { version = "9", default-features = false }
# OS-secure credential storage for agent-runtime API keys. The keyring crate
# speaks the platform-native store (Windows Credential Manager, macOS
# Keychain, Linux Secret Service) and ships a `mock` in-process backend used
# by tests so they never touch the real OS keychain. v3 is the current
# stable line with the bring-your-own-store architecture.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Encrypted local-first store (see docs/superpowers/specs/2026-06-28-encrypted-storage-design.md).
# `rusqlite` `bundled` compiles the SQLite C amalgamation with the system C
# compiler (no system SQLite needed). SQLCipher was ruled out: every flavor
# needs a system OpenSSL (`OPENSSL_DIR`) or a full Perl to build vendored
# OpenSSL, neither of which is reliably present in this build env or CI.
# Encryption is therefore application-layer AES-256-GCM (pure Rust, no native
# crypto) over bundled SQLite. The 32-byte master key lives in OS secure
# storage under a dedicated keyring service (`com.fable.workspace.vault`).
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
hex = "0.4"
tempfile = "3"
