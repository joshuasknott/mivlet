[package]
name = "arden-desktop"
version = "0.1.0"
description = "Arden desktop runtime"
authors = ["Arden"]
edition = "2021"

[lib]
name = "arden_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "arden-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Native-API egress: reqwest owns the HTTP/SSE call (Rust adds the API key as a
# header here; TS never sees it). `rustls-no-provider` resolves offline against
# the existing lockfile (verified during planning). `stream` enables SSE.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
    "stream",
] }
tokio = { version = "1", features = ["sync", "rt", "macros"] }
futures-util = "0.3"
