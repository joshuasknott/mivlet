# Cloudflare Workers configuration for the Fable auth broker.
#
# The broker core is runtime-neutral (Web Crypto + standard Request/Response);
# this target compiles `src/worker.ts` (the Workers fetch handler) over the same
# `src/router.ts` and `src/broker.ts` the Node `src/server.ts` transport uses.
#
# Deploy: `pnpm --filter @fable/broker build` then `npx wrangler deploy`.
# Secrets (never committed) are set per environment with:
#   npx wrangler secret put FABLE_BROKER_GITHUB_CLIENT_ID
#   npx wrangler secret put FABLE_BROKER_GITHUB_CLIENT_SECRET
#   ...one pair per confidential provider.
# FABLE_BROKER_PUBLIC_URL must be the HTTPS origin registered in each provider
# console and is set as a plain var (not secret) below per environment.

name = "fable-auth-broker"
main = "dist/worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# The broker needs outbound subrequests to provider token/identity/revocation
# endpoints. The Workers free tier is fine for low-volume desktop OAuth.
limits = { cpu_ms = 100 }

# Non-secret configuration. Override per environment with [env.staging] / [env.prod].
[vars]
FABLE_BROKER_PUBLIC_URL = "https://auth-broker.example.invalid"
FABLE_BROKER_RATE_LIMIT_PER_MINUTE = "60"

# Staging environment. Deploy with `npx wrangler deploy --env staging`.
[env.staging]
name = "fable-auth-broker-staging"
[env.staging.vars]
FABLE_BROKER_PUBLIC_URL = "https://auth-broker-staging.example.invalid"
FABLE_BROKER_RATE_LIMIT_PER_MINUTE = "60"

# Production environment. Deploy with `npx wrangler deploy --env prod`.
[env.prod]
name = "fable-auth-broker"
[env.prod.vars]
FABLE_BROKER_PUBLIC_URL = "https://auth-broker.example.invalid"
FABLE_BROKER_RATE_LIMIT_PER_MINUTE = "60"
