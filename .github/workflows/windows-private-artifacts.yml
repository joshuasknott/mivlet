name: Windows preview artifacts

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Artifact channel (artifacts are accessible from this repository)
        required: true
        default: private
        type: choice
        options:
          - private
          - internal
          - preview

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/cache@v4
        id: audit
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - if: steps.audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: pnpm tauri:build --ci --no-sign --bundles msi,nsis
      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path output/windows -Force | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi output/windows/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe output/windows/
      - name: Generate manifest and notes
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          $createdAt = git show -s --format=%cI HEAD
          $canonical = ([DateTimeOffset]::Parse($createdAt)).UtcDateTime.ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          node scripts/release/windows-manifest.mjs `
            --artifacts output/windows `
            --output output/windows/release-manifest.json `
            --notes output/windows/RELEASE_NOTES.md `
            --channel $env:RELEASE_CHANNEL `
            --commit $env:GITHUB_SHA `
            --created-at $canonical
      - name: Rehearse clean install and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem output/windows/*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer." }
          powershell -ExecutionPolicy Bypass -File scripts/release/test-windows-installer.ps1 `
            -InstallerPath $installers[0].FullName `
            -AllowMachineChanges
      - uses: actions/upload-artifact@v4
        with:
          name: fable-windows-${{ inputs.channel }}-${{ github.sha }}
          path: output/windows
          if-no-files-found: error
          retention-days: 14
