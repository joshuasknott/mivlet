name: Full validation
run-name: ${{ inputs.bundle_profile && 'Production bundle profile' || 'Full validation' }}

on:
  workflow_dispatch:
    inputs:
      bundle_profile:
        description: Profile the production renderer only (not full validation)
        type: boolean
        default: false
      baseline_commit:
        description: Optional ancestor commit for an exact same-run renderer graph comparison
        type: string
        default: ""
      native_preview:
        description: Also build an unsigned debug executable after renderer verification
        type: boolean
        default: false
      native_release:
        description: Also build optimized native measurement artifacts (and the requested ancestor)
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.bundle_profile && 'profile' || 'full' }}
  cancel-in-progress: true

jobs:
  check:
    # A profile dispatch must not emit a skipped/successful required `check`.
    name: ${{ inputs.bundle_profile && 'full-validation-not-requested' || 'check' }}
    if: ${{ !inputs.bundle_profile }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: mivlet-windows
      - uses: actions/cache@v4
        id: audit
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - if: steps.audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --manifest-path packages/windows-executor/Cargo.toml --check
      - run: cargo test --manifest-path packages/windows-executor/Cargo.toml --locked
      - run: cargo clippy --manifest-path packages/windows-executor/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
  bundle-profile:
    if: ${{ inputs.bundle_profile }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mivlet/protocol build
      - run: pnpm --filter @mivlet/desktop typecheck
      - run: pnpm quality
      - run: node --test scripts/perf/profile.test.mjs scripts/perf/budget.test.mjs scripts/perf/compare-graphs.test.mjs
      - name: Profile the requested ancestor with the same install
        if: ${{ inputs.baseline_commit != '' }}
        shell: pwsh
        env:
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BASELINE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Expected a full lowercase commit SHA.' }
          git merge-base --is-ancestor $env:BASELINE_COMMIT $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Baseline must be an ancestor of this exact checkout.' }
          $finalCommit = $env:GITHUB_SHA
          $finalLock = (Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash
          try {
            git checkout --detach $env:BASELINE_COMMIT
            if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed.' }
            if ((Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash -ne $finalLock) { throw 'A same-install comparison requires the same pnpm lockfile.' }
            $env:GITHUB_SHA = $env:BASELINE_COMMIT
            pnpm --filter @mivlet/desktop exec vite build --config ../../scripts/perf/profile.vite.config.mjs --configLoader runner
            if ($LASTEXITCODE -ne 0) { throw 'Baseline profile failed.' }
            Copy-Item -LiteralPath output/bundle-profile/report.json -Destination "$env:RUNNER_TEMP/baseline-profile.json"
          } finally {
            $env:GITHUB_SHA = $finalCommit
            git checkout --detach $finalCommit
            if ($LASTEXITCODE -ne 0) { throw 'Final checkout restoration failed.' }
          }
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/baseline-profile.json" -Destination output/bundle-profile/baseline.json
      - run: pnpm --filter @mivlet/desktop exec vite build --config ../../scripts/perf/profile.vite.config.mjs --configLoader runner
      - if: ${{ inputs.baseline_commit != '' }}
        run: node scripts/perf/compare-graphs.mjs output/bundle-profile/baseline.json output/bundle-profile/report.json output/bundle-profile/graph-comparison.json
      - run: pnpm perf:check
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: bundle-profile-${{ github.sha }}
          path: output/bundle-profile/*.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ github.sha }}
          path: apps/desktop/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  native-release:
    if: ${{ inputs.bundle_profile && inputs.native_release }}
    needs: bundle-profile
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: mivlet-windows-release
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Build optimized executables with their native resources
        shell: pwsh
        env:
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $finalCommit = $env:GITHUB_SHA
          $lockHash = (Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash
          $cargoHash = (Get-FileHash apps/desktop/src-tauri/Cargo.lock -Algorithm SHA256).Hash
          $revisions = @($finalCommit)
          if ($env:BASELINE_COMMIT) {
            if ($env:BASELINE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Expected a full lowercase baseline SHA.' }
            git merge-base --is-ancestor $env:BASELINE_COMMIT $finalCommit
            if ($LASTEXITCODE -ne 0) { throw 'Baseline must be an ancestor of the requested checkout.' }
            $revisions = @($env:BASELINE_COMMIT, $finalCommit) | Select-Object -Unique
          }
          try {
            foreach ($revision in $revisions) {
              git checkout --detach $revision
              if ($LASTEXITCODE -ne 0) { throw 'Native source checkout failed.' }
              if ((Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash -ne $lockHash -or
                  (Get-FileHash apps/desktop/src-tauri/Cargo.lock -Algorithm SHA256).Hash -ne $cargoHash) {
                throw 'A same-install native comparison requires matching dependency lockfiles.'
              }
              # Generated runtimes must not retain files removed by the next revision.
              # Only ignored resources inside this disposable checkout are removed;
              # tracked manifests/notices, dependencies and Cargo caches stay intact.
              $resourceRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'apps/desktop/src-tauri/resources'))
              $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
              if (-not $resourceRoot.StartsWith($workspaceRoot, [StringComparison]::OrdinalIgnoreCase)) {
                throw 'Generated resource cleanup escaped the checkout.'
              }
              git clean -fdX -- apps/desktop/src-tauri/resources
              if ($LASTEXITCODE -ne 0) { throw 'Generated resource cleanup failed.' }
              pnpm --filter @mivlet/protocol build
              if ($LASTEXITCODE -ne 0) { throw 'Native protocol dependency build failed.' }
              pnpm --filter @mivlet/connectors build
              if ($LASTEXITCODE -ne 0) { throw 'Native connector dependency build failed.' }
              pnpm --filter @mivlet/knowledge build
              if ($LASTEXITCODE -ne 0) { throw 'Native knowledge dependency build failed.' }
              pnpm tauri:build --ci --no-sign --no-bundle
              if ($LASTEXITCODE -ne 0) { throw 'Optimized native build failed.' }
              $destination = Join-Path 'output/native-release' $revision
              New-Item -ItemType Directory -Force "$destination/resources" | Out-Null
              Copy-Item -LiteralPath apps/desktop/src-tauri/target/release/mivlet-desktop.exe -Destination "$destination/mivlet-desktop.exe"
              # Match the resource layout declared in tauri.conf.json. Keep this
              # measurement artifact self-contained without installing over a user's app.
              $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
              $expected = @('resources/cua-driver/**/*', 'resources/agent-host/**/*', 'resources/execution-runtime/**/*', 'resources/pdfjs-notices/**/*', 'resources/pdf-fonts/README.md')
              if (Compare-Object $expected $config.bundle.resources) { throw 'Update native artifact staging for the changed bundle resources.' }
              foreach ($directory in @('cua-driver', 'agent-host', 'execution-runtime', 'pdfjs-notices')) {
                Copy-Item -LiteralPath "apps/desktop/src-tauri/resources/$directory" -Destination "$destination/resources/$directory" -Recurse
              }
              New-Item -ItemType Directory -Force "$destination/resources/pdf-fonts" | Out-Null
              Copy-Item -LiteralPath apps/desktop/src-tauri/resources/pdf-fonts/README.md -Destination "$destination/resources/pdf-fonts/README.md"
              $root = (Resolve-Path -LiteralPath $destination).Path
              $files = @{}
              Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
                $files[$relative] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              @{ commit = $revision; executableSha256 = $files['mivlet-desktop.exe']; files = $files;
                 cargoLockSha256 = $cargoHash.ToLowerInvariant(); pnpmLockSha256 = $lockHash.ToLowerInvariant();
                 profile = 'release'; command = 'pnpm tauri:build --ci --no-sign --no-bundle';
                 signed = $false; installer = $false; rust = (rustc --version); cargo = (cargo --version)
              } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$destination/receipt.json"
            }
          } finally {
            git checkout --detach $finalCommit
            if ($LASTEXITCODE -ne 0) { throw 'Final checkout restoration failed.' }
          }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: native-release-${{ github.sha }}
          path: output/native-release
          if-no-files-found: error
          retention-days: 7
  native-preview:
    if: ${{ inputs.bundle_profile && inputs.native_preview }}
    needs: bundle-profile
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: mivlet-windows
      - uses: actions/download-artifact@v4
        with:
          name: renderer-${{ github.sha }}
          path: apps/desktop/dist
      - name: Build the exact-source debug acceptance executable
        shell: pwsh
        run: |
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --bin mivlet-desktop `
            --config profile.dev.package.mivlet-desktop.debug=0 `
            --config profile.dev.package.mivlet-desktop.incremental=false
          if ($LASTEXITCODE -ne 0) { throw 'Native preview build failed.' }
          New-Item -ItemType Directory -Force output/native-preview | Out-Null
          Copy-Item -LiteralPath apps/desktop/src-tauri/target/debug/mivlet-desktop.exe -Destination output/native-preview/mivlet-desktop.exe
          @{ commit = $env:GITHUB_SHA; executableSha256 = (Get-FileHash output/native-preview/mivlet-desktop.exe -Algorithm SHA256).Hash.ToLowerInvariant(); cargoLockSha256 = (Get-FileHash apps/desktop/src-tauri/Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant(); signed = $false; purpose = 'Debug acceptance only; not an installer or release'; rust = (rustc --version); cargo = (cargo --version) } | ConvertTo-Json | Set-Content -Encoding utf8 output/native-preview/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-preview-${{ github.sha }}
          path: output/native-preview
          if-no-files-found: error
          retention-days: 7
