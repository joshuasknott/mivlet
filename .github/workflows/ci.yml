name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse mock Clerk in production configs
        run: node --test scripts/ci/refuse-mock-clerk.test.mjs && node scripts/ci/refuse-mock-clerk.mjs
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/affected.mjs

  typescript:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:pnpm
      - run: pnpm typecheck
      - run: pnpm quality
      - run: pnpm test:pr
      - name: Verify the independent marketing app
        run: |
          pnpm --dir apps/marketing install --frozen-lockfile
          pnpm --dir apps/marketing test
          pnpm --dir apps/marketing build

  windows:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: mivlet-windows
      - uses: actions/cache@v4
        id: audit
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - if: steps.audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:all
      - run: pnpm --filter @mivlet/protocol build
      - run: pnpm --filter @mivlet/connectors build
      - run: pnpm --filter @mivlet/agent-host build
      - run: pnpm test:host
      - run: pnpm release:test
      - run: cargo fmt --manifest-path packages/windows-executor/Cargo.toml --check
      - run: cargo test --manifest-path packages/windows-executor/Cargo.toml --locked
      - run: cargo clippy --manifest-path packages/windows-executor/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --manifest-path vendor/webview2-com/Cargo.toml --lib --locked --target-dir apps/desktop/src-tauri/target
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  linux:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: mivlet-linux
      - run: pnpm install --frozen-lockfile
      - run: pnpm linux:doctor
      - run: pnpm linux:test
      - run: pnpm --filter @mivlet/protocol build
      - run: pnpm --filter @mivlet/connectors build
      - run: pnpm --filter @mivlet/agent-host build
      - run: pnpm test:host
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      # Shared Windows implementation bodies remain compiled for fail-closed
      # Linux stubs. Windows CI retains strict dead-code validation.
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings -A dead_code
      - run: pnpm tauri:build --debug --bundles deb

  check:
    if: always()
    needs: [changes, typescript, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Require every affected job to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          NATIVE: ${{ needs.changes.outputs.native }}
          TYPESCRIPT: ${{ needs.typescript.result }}
          WINDOWS: ${{ needs.windows.result }}
          LINUX: ${{ needs.linux.result }}
        run: |
          test "$CHANGES" = success
          if [ "$CODE" = true ]; then test "$TYPESCRIPT" = success; fi
          if [ "$NATIVE" = true ]; then test "$WINDOWS" = success; fi
          if [ "$NATIVE" = true ]; then test "$LINUX" = success; fi
